[package]
name = "apnt-sp1-notecommitment-verifier"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "apnt-sp1-notecommitment-verify"
path = "src/bin/apnt-sp1-notecommitment-verify.rs"

[dependencies]
bincode = "=1.3.3"
hex = "=0.4.3"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sp1-sdk = { version = "=6.3.1", default-features = false, features = ["blocking"] }


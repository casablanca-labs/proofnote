[package]
name = "apnt-private-note-transition-v1-rust-parity"
version = "0.1.0"
edition = "2021"
publish = false
description = "Exact Rust parity for the additive APNT private-note-transition v1 host relation"

[dependencies]
apnt-import-created-note-rust-parity = { path = "../apnt-import-created-note-rust-parity" }
apnt-recovery-v1-rust-parity = { path = "../apnt-recovery-v1-rust-parity" }
sha2 = "=0.10.9"
k256 = { version = "=0.13.4", default-features = false, features = ["arithmetic", "schnorr", "alloc"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[dev-dependencies]
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
